<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- fundo -->
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect width="256" height="256" rx="58" fill="url(#sheen)"/>

  <!-- janela do editor -->
  <g filter="url(#shadow)">
    <rect x="46" y="52" width="164" height="152" rx="16" fill="#0d1117"/>
    <rect x="46" y="52" width="164" height="30" rx="16" fill="#161b22"/>
    <rect x="46" y="70" width="164" height="12" fill="#161b22"/>
    <circle cx="66" cy="67" r="5" fill="#ff5f56"/>
    <circle cx="84" cy="67" r="5" fill="#ffbd2e"/>
    <circle cx="102" cy="67" r="5" fill="#27c93f"/>
  </g>

  <!-- números de linha -->
  <g fill="#3d4450">
    <rect x="60" y="98"  width="6" height="8" rx="3"/>
    <rect x="60" y="118" width="6" height="8" rx="3"/>
    <rect x="60" y="138" width="6" height="8" rx="3"/>
    <rect x="60" y="158" width="6" height="8" rx="3"/>
    <rect x="60" y="178" width="6" height="8" rx="3"/>
  </g>

  <!-- linhas de sintaxe -->
  <g rx="4">
    <rect x="78"  y="98"  width="60" height="9" rx="4.5" fill="#c678dd"/>
    <rect x="144" y="98"  width="42" height="9" rx="4.5" fill="#61afef"/>
    <rect x="90"  y="118" width="70" height="9" rx="4.5" fill="#e5c07b"/>
    <rect x="90"  y="138" width="48" height="9" rx="4.5" fill="#98c379"/>
    <rect x="144" y="138" width="30" height="9" rx="4.5" fill="#56b6c2"/>
    <rect x="78"  y="158" width="52" height="9" rx="4.5" fill="#61afef"/>
    <rect x="90"  y="178" width="66" height="9" rx="4.5" fill="#abb2bf"/>
    <rect x="162" y="178" width="6"  height="12" fill="#61afef"/>
  </g>

  <!-- selo OMM -->
  <g>
    <circle cx="196" cy="196" r="30" fill="#0d1117" stroke="#7c3aed" stroke-width="3"/>
    <text x="196" y="201" font-family="Arial, Helvetica, sans-serif" font-size="20"
          font-weight="700" fill="#ffffff" text-anchor="middle">OMM</text>
  </g>
</svg>
